<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LyHENG VND-USD — Currency Exchange Calculator & Rate Management">

  <!-- Viewport meta tag for flawless mobile auto-fit -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LyHENG VND-USD">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Theme color -->
  <meta name="theme-color" content="#0F172A">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LyHENG VND-USD</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* PWA Banner Styles */
    #pwa-install-banner {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      background: #0F172A;
      color: #FFFFFF;
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      border: 1.5px solid rgba(16, 185, 129, 0.5);
      z-index: 9999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      animation: pwaSlideUp 0.35s ease-out;
    }

    @keyframes pwaSlideUp {
      from { transform: translate(-50%, 40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Smart PWA Installation Banner -->
  <div id="pwa-install-banner">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="icons/Icon-192.png" style="width: 42px; height: 42px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);" alt="LyHENG Logo" />
        <div>
          <div style="font-weight: 800; font-size: 14px; color: #FFFFFF; line-height: 1.2;">LyHENG VND-USD</div>
          <div id="pwa-install-desc" style="font-size: 11px; color: #94A3B8; margin-top: 2px;">Cài đặt ứng dụng về màn hình chính</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <button id="pwa-install-btn" style="background: #10B981; color: white; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap;">Cài đặt</button>
        <button id="pwa-close-btn" style="background: transparent; color: #94A3B8; border: none; font-size: 18px; cursor: pointer; padding: 4px 8px; line-height: 1;">✕</button>
      </div>
    </div>
    <div id="pwa-ios-instructions" style="display: none; margin-top: 10px; font-size: 12px; color: #E2E8F0; border-top: 1px solid #1E293B; padding-top: 8px; line-height: 1.4;">
      👉 Nhấn biểu tượng <strong>Chia sẻ (Share) ⎋</strong> ở thanh dưới ➔ chọn <strong>"Thêm vào MH chính" (Add to Home Screen)</strong>.
    </div>
  </div>

  <script>
    let deferredInstallPrompt = null;
    const isStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    // Listen for browser install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (!isStandaloneMode && !sessionStorage.getItem('lyheng_pwa_dismissed')) {
        setTimeout(() => {
          const banner = document.getElementById('pwa-install-banner');
          if (banner) banner.style.display = 'block';
        }, 1500);
      }
    });

    // Detect iOS Safari
    const isIosDevice = () => {
      const ua = window.navigator.userAgent.toLowerCase();
      return /iphone|ipad|ipod/.test(ua);
    };

    if (isIosDevice() && !isStandaloneMode && !sessionStorage.getItem('lyheng_pwa_dismissed')) {
      setTimeout(() => {
        const banner = document.getElementById('pwa-install-banner');
        const iosGuide = document.getElementById('pwa-ios-instructions');
        const installBtn = document.getElementById('pwa-install-btn');
        if (banner && iosGuide) {
          banner.style.display = 'block';
          if (installBtn) installBtn.style.display = 'none';
          iosGuide.style.display = 'block';
        }
      }, 2000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const installBtn = document.getElementById('pwa-install-btn');
      const closeBtn = document.getElementById('pwa-close-btn');
      const banner = document.getElementById('pwa-install-banner');

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredInstallPrompt) {
            deferredInstallPrompt.prompt();
            const { outcome } = await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            if (banner) banner.style.display = 'none';
          }
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          if (banner) banner.style.display = 'none';
          sessionStorage.setItem('lyheng_pwa_dismissed', 'true');
        });
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
